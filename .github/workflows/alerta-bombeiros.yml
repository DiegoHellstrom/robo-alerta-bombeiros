name: Alerta Bombeiros

on:
  # O agendamento será reativado quando o executor tiver acesso de rede ao SYSBM.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerta-bombeiros
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install chromium

      - name: Consultar SYSBM e enviar alertas
        id: robo
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYSBM_LOOKBACK: U7
          SYSBM_TIMEOUT_MS: '90000'
        run: npm start

      - name: Salvar estado de deduplicação
        if: always()
        shell: pwsh
        run: |
          git diff --quiet -- state/processed.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Estado sem alterações."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/processed.json
          git commit -m "Atualiza estado do robô [skip ci]"
          $branch = "${{ github.event.repository.default_branch }}"
          git pull --rebase origin $branch
          git push origin "HEAD:$branch"

      - name: Falhar execução se o robô falhou
        if: steps.robo.outcome == 'failure'
        run: exit 1

